<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Layer 5 viewer</title>
<style>
  html, body { margin: 0; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "./node_modules/three/build/three.module.js",
    "three/addons/": "./node_modules/three/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// mode=rgb (default) or mode=id. Person 4 owns the id branch below.
const mode = new URLSearchParams(location.search).get('mode') || 'rgb';
if (mode === 'id') THREE.ColorManagement.enabled = false;

window.sceneReady = false;
window.sceneError = null;

const renderer = new THREE.WebGLRenderer({
  antialias: mode !== 'id',          // id mode must have no antialiasing
  preserveDrawingBuffer: true        // needed for toDataURL
});
renderer.setPixelRatio(1);
if (mode === 'id') {
  renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
}
renderer.setSize(1280, 800);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(mode === 'id' ? 0x000000 : 0x9ec9ea);

// Lights (only matter in rgb mode)
scene.add(new THREE.HemisphereLight(0xffffff, 0x666666, 1.2));
const sun = new THREE.DirectionalLight(0xffffff, 2.0);
sun.position.set(200, 400, 100);
scene.add(sun);

const camera = new THREE.PerspectiveCamera(60, 1280 / 800, 0.5, 5000);
let mixer = null;

const flatMaterialCache = new Map();

function getFlatMaterial(objectId) {
  if (!flatMaterialCache.has(objectId)) {
    flatMaterialCache.set(
      objectId,
      new THREE.MeshBasicMaterial({
        color: new THREE.Color(objectId / 255, 0, 0),
        side: THREE.DoubleSide,
        toneMapped: false
      })
    );
  }

  return flatMaterialCache.get(objectId);
}

async function applyIdMaterials(gltf) {
  const response = await fetch('city/scene_manifest.json');

  if (!response.ok) {
    throw new Error('Could not load city/scene_manifest.json');
  }

  const manifest = await response.json();

  // Make the complete scene black first.
  // This preserves depth occlusion from roads and buildings.
  gltf.scene.traverse((node) => {
    if (node.isMesh) {
      node.material = getFlatMaterial(0);
    }
  });

  // Assign each object's ID to its source-node subtree.
  for (const object of manifest.objects) {
    const id = Number(object.object_id);
    const sourceNode = object.source_node;

    if (!Number.isInteger(id) || id < 1 || id > 255) {
      throw new Error(`Invalid object ID: ${object.object_id}`);
    }

    if (sourceNode == null) {
      console.warn(`Object ${id} has no source_node; skipping ID render.`);
      continue;
    }

    const node = await gltf.parser.getDependency(
      'node',
      sourceNode
    );

    if (!node) {
      throw new Error(`Missing glTF node ${sourceNode} for object ${id}`);
    }

    let meshCount = 0;

    node.traverse((child) => {
      if (child.isMesh) {
        child.material = getFlatMaterial(id);
        meshCount++;
      }
    });

    if (meshCount === 0) {
      throw new Error(
        `No meshes found for object ${id}, source_node ${sourceNode}`
      );
    }
  }
}

new GLTFLoader().load(
  'city/scene.gltf',
  async (gltf) => {
    // Hide the outline line objects
    gltf.scene.traverse((o) => {
      if (o.isLineSegments || o.isLine) o.visible = false;
    });
    scene.add(gltf.scene);

    // Animation (12 s loop)
    mixer = new THREE.AnimationMixer(gltf.scene);
    if (gltf.animations.length > 0) {
      mixer.clipAction(gltf.animations[0]).play();
    }

    if (mode === 'id') {
      try {
        await applyIdMaterials(gltf);
      } catch (error) {
        window.sceneError = String(error);
        console.error(error);
        return;
      }
    }

    window.sceneReady = true;
    // Show a default view so you can check the page by eye
    renderFrame({
      t: 0, pos: [175, 147, -76], look_at: [115, 97, -76],
      fov_deg: 60, width: 1280, height: 800
    });
  },
  undefined,
  (err) => { window.sceneError = String(err); console.error(err); }
);

// cam = {t, pos, look_at, fov_deg, width, height}; returns a PNG data URL
window.renderFrame = function (cam) {
  if (mixer) mixer.setTime(cam.t);

  renderer.setSize(cam.width, cam.height);
  camera.fov = cam.fov_deg;               // vertical fov
  camera.aspect = cam.width / cam.height;
  camera.updateProjectionMatrix();

  camera.position.set(cam.pos[0], cam.pos[1], cam.pos[2]);

  // If looking straight down, the default up vector breaks lookAt
  const dx = cam.look_at[0] - cam.pos[0];
  const dy = cam.look_at[1] - cam.pos[1];
  const dz = cam.look_at[2] - cam.pos[2];
  const horiz = Math.hypot(dx, dz);
  if (horiz < 1e-3 * Math.abs(dy)) camera.up.set(0, 0, -1);
  else camera.up.set(0, 1, 0);

  camera.lookAt(cam.look_at[0], cam.look_at[1], cam.look_at[2]);
  camera.updateMatrixWorld(true);

  renderer.render(scene, camera);
  return renderer.domElement.toDataURL('image/png');
};
</script>
</body>
</html>
